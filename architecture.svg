<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #ffffff;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#222">StrataCopilot — RAG Architecture</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#666">End-to-end document intelligence pipeline</text>

  <!-- USER LAYER -->
  <rect x="240" y="70" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="96" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Streamlit UI</text>
  <text x="475" y="96" font-size="11" fill="#888">User uploads + queries</text>

  <!-- Arrow down -->
  <line x1="340" y1="114" x2="340" y2="148" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="355" y="136" font-size="11" fill="#888">python-multipart</text>

  <!-- API LAYER -->
  <rect x="220" y="148" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="172" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">FastAPI + Uvicorn</text>
  <text x="340" y="190" text-anchor="middle" font-size="12" fill="#185FA5">REST API backend</text>
  <text x="475" y="180" font-size="11" fill="#888">Pydantic validation</text>

  <!-- Arrow down to ingestion -->
  <line x1="280" y1="204" x2="280" y2="248" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="220" y="232" font-size="11" fill="#888">Ingest</text>

  <!-- Arrow down to query -->
  <line x1="400" y1="204" x2="400" y2="378" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="415" y="290" font-size="11" fill="#888">Query</text>

  <!-- DOCUMENT PARSING -->
  <rect x="100" y="248" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="205" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Document parsing</text>
  <text x="205" y="290" text-anchor="middle" font-size="12" fill="#0F6E56">pypdf + python-docx</text>

  <!-- Arrow down -->
  <line x1="205" y1="304" x2="205" y2="338" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CHUNKING -->
  <rect x="100" y="338" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="205" y="362" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Chunking</text>
  <text x="205" y="380" text-anchor="middle" font-size="12" fill="#0F6E56">tiktoken (token-aware)</text>

  <!-- Arrow down -->
  <line x1="205" y1="394" x2="205" y2="428" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- EMBEDDING -->
  <rect x="100" y="428" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="205" y="452" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Embedding</text>
  <text x="205" y="470" text-anchor="middle" font-size="12" fill="#0F6E56">sentence-transformers (HF)</text>

  <!-- Arrow down to FAISS -->
  <line x1="205" y1="484" x2="205" y2="518" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- FAISS VECTOR STORE -->
  <rect x="100" y="518" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="205" y="542" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">FAISS vector store</text>
  <text x="205" y="560" text-anchor="middle" font-size="12" fill="#854F0B">faiss-cpu (similarity search)</text>

  <!-- Arrow from FAISS to Bedrock -->
  <line x1="310" y1="546" x2="400" y2="546" stroke="#999" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="546" x2="400" y2="434" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="355" y="490" font-size="11" fill="#888">Top-k chunks</text>

  <!-- AWS BEDROCK -->
  <rect x="340" y="378" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="460" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">AWS Bedrock</text>
  <text x="460" y="420" text-anchor="middle" font-size="12" fill="#993C1D">boto3 / botocore (LLM)</text>

  <!-- Arrow from Bedrock back up -->
  <path d="M580 406 L620 406 L620 176 L460 176" fill="none" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="628" y="300" font-size="11" fill="#888">Response</text>

  <!-- ENV CONFIG -->
  <rect x="420" y="518" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="520" y="544" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Environment config</text>
  <text x="520" y="578" text-anchor="middle" font-size="11" fill="#888">python-dotenv + .env</text>

  <!-- Legend -->
  <rect x="40" y="595" width="10" height="10" rx="2" fill="#5DCAA5"/>
  <text x="56" y="604" font-size="11" fill="#666">Ingestion pipeline</text>
  <rect x="200" y="595" width="10" height="10" rx="2" fill="#F0997B"/>
  <text x="216" y="604" font-size="11" fill="#666">LLM inference</text>
  <rect x="340" y="595" width="10" height="10" rx="2" fill="#EF9F27"/>
  <text x="356" y="604" font-size="11" fill="#666">Vector storage</text>
  <rect x="480" y="595" width="10" height="10" rx="2" fill="#85B7EB"/>
  <text x="496" y="604" font-size="11" fill="#666">API layer</text>

</svg>